events {
    worker_connections 1024;
}

http {
    # 基础类型映射，防止 CSS/JS 文件 MIME 类型错误导致前端白屏
    include       mime.types;
    default_type  application/octet-stream;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 80;

        # 🛡️ 核心保留：A25 无侵入式探针嵌入第三方平台的跨域特权
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;

        # ==========================================
        # 1. 转发前端请求
        # ==========================================
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 加入 WebSocket 支持，防止 Vite 热更新或长连接报 WSS 错误
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ==========================================
        # 2. 🌟 专属大文件路由：AST 逆向批注接口
        # ==========================================
        location /api/annotate_docx {
            # 直接穿透网关，打向专职处理文档的算力节点
            proxy_pass http://grading-service:8002/api/annotate_docx;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 🚨 允许上传最大 50MB 的作业文档，否则会报 413 Payload Too Large
            client_max_body_size 50M;
            proxy_read_timeout 120s; # AST 空间映射较耗时
        }

        # ==========================================
        # 3. 🌟 核心网关请求：大模型智能体分发
        # ==========================================
        location /api/ {
            proxy_pass http://agent-gateway:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 🚨 AI 流式打字机效果核心解锁：关闭所有缓冲！
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;

            # 超时时间必须放大！RAG 检索 + 大模型深度思考很容易超过 60 秒
            # 如果设为 60s，大模型话说到一半 Nginx 就会强行切断连接报错 504
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
        }
    }
}