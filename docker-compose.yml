version: '3.8'

services:
  # ==========================================
  # 1. 前端服务
  # ==========================================
  frontend:
    build: ./frontend
    image: a25-frontend
    container_name: a25-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  # ==========================================
  # 2. Agent 调度网关
  # ==========================================
  agent-gateway:
    build: ./backend/agent-gateway
    container_name: a25-agent-gateway
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=sk-6836300a7db64bceb5ab29f597ff3ea9
      - RAG_SERVICE_URL=http://rag-service:8001
      - GRADING_SERVICE_URL=http://grading-service:8002
    depends_on:
      - rag-service
      - grading-service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
  # ==========================================
  # 3. RAG 知识微服务
  # ==========================================
  rag-service:
    build: ./backend/rag-service
    container_name: a25-rag-service
    expose:
      - "8001"
    environment:
      - OPENAI_API_KEY=sk-6836300a7db64bceb5ab29f597ff3ea9
    volumes:
      - ./backend/chroma_db:/app/chroma_db

  # ==========================================
  # 4. 批改引擎微服务
  # ==========================================
  grading-service:
    build: ./backend/grading-service
    container_name: a25-grading-service
    expose:
      - "8002"
    environment:
      - OPENAI_API_KEY=sk-6836300a7db64bceb5ab29f597ff3ea9

  # ==========================================
  # 🌟 5. Nginx 服务 (现在它乖乖缩进了！)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: a25-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - agent-gateway
